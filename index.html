<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>进制转换工具</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="converter-card">
      <h1>进制转换工具</h1>
      <p class="description">默认提供 2、10、16 进制转换。</p>

      <form id="converter-form" novalidate>
        <label for="source-value">输入数值</label>
        <input
          id="source-value"
          name="sourceValue"
          type="text"
          placeholder="例如：1010 / ff / 255"
          autocomplete="off"
          required
        />

        <div class="base-selector-group">
          <div>
            <p class="group-title">原始进制</p>
            <div class="base-options" role="radiogroup" aria-label="原始进制">
              <button type="button" class="base-option is-active" data-target="from-base" data-base="10">10 进制</button>
              <button type="button" class="base-option" data-target="from-base" data-base="2">2 进制</button>
              <button type="button" class="base-option" data-target="from-base" data-base="16">16 进制</button>
            </div>
            <input id="from-base" name="fromBase" type="hidden" value="10" />
          </div>

          <div>
            <p class="group-title">目标进制</p>
            <div class="base-options" role="radiogroup" aria-label="目标进制">
              <button type="button" class="base-option is-active" data-target="to-base" data-base="2">2 进制</button>
              <button type="button" class="base-option" data-target="to-base" data-base="10">10 进制</button>
              <button type="button" class="base-option" data-target="to-base" data-base="16">16 进制</button>
            </div>
            <input id="to-base" name="toBase" type="hidden" value="2" />
          </div>
        </div>

        <button type="submit">开始转换</button>
      </form>

      <section class="result">
        <h2>转换结果</h2>
        <output id="result-value">-</output>
        <p id="result-error" class="error" aria-live="polite"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
